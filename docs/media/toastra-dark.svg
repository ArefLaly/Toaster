<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-label="Toastra dark theme toasts">
  <defs>
    <style>
      .page { fill: #0f0d0b; }
      .card { fill: #16130f; stroke: rgba(255,248,236,0.16); }
      .title { font: 700 15px "Avenir Next", "Segoe UI", ui-sans-serif, system-ui, sans-serif; fill: #f7f0e6; letter-spacing: -0.3px; }
      .desc { font: 400 13.5px "Avenir Next", "Segoe UI", ui-sans-serif, system-ui, sans-serif; fill: #c8bcae; }
      .spin { transform-origin: 31px 31px; animation: spin 0.85s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <filter id="dshadow" x="-8%" y="-16%" width="116%" height="148%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect class="page" width="760" height="340"/>
  <text x="48" y="44" class="title" font-size="20">Dark theme</text>
  <text x="48" y="66" class="desc">Same square card, inverted tokens</text>

  <g filter="url(#dshadow)">
    <rect class="card" x="48" y="88" width="384" height="88"/>
    <rect x="48" y="88" width="3" height="88" fill="#4ad496"/>
    <rect x="67" y="106" width="34" height="34" rx="2" fill="rgba(74,212,150,0.14)"/>
    <g transform="translate(72 111)" fill="none" stroke="#4ad496" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10" fill="#4ad496" opacity="0.18" stroke="none"/>
      <path d="M8 12.4 10.6 15 16 9.2"/>
    </g>
    <text class="title" x="115" y="124">Employee created</text>
    <text class="desc" x="115" y="146">Ada Lovelace was added.</text>
    <text class="desc" x="404" y="120" font-size="16">×</text>
  </g>

  <g filter="url(#dshadow)">
    <rect class="card" x="48" y="192" width="384" height="104"/>
    <rect x="48" y="192" width="3" height="104" fill="#e4c56a"/>
    <rect x="67" y="210" width="34" height="34" rx="2" fill="rgba(228,197,106,0.14)"/>
    <g class="spin" transform="translate(72 215)" fill="none" stroke="#e4c56a" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="8" opacity="0.22"/>
      <path d="M12 4a8 8 0 0 1 8 8"/>
    </g>
    <text class="title" x="115" y="228">Uploading file&</text>
    <text class="desc" x="115" y="250">This stays until you update it.</text>
    <rect x="67" y="276" width="346" height="2" fill="rgba(228,197,106,0.2)"/>
    <rect x="67" y="276" width="210" height="2" fill="#e4c56a"/>
    <text class="desc" x="404" y="224" font-size="16">×</text>
  </g>
</svg>
